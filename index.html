<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Radar del Dragón Real</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
margin:0;
padding:0;
}

h1{
padding:15px;
color:#ff5555;
}

#contador{
font-size:22px;
margin-bottom:10px;
}

#map{
height:600px;
width:95%;
margin:auto;
border:4px solid #ff4444;
border-radius:15px;
}

.panel{
margin:20px;
}

input{
padding:10px;
font-size:16px;
width:250px;
}

button{
padding:10px 20px;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

#resultado{
margin-top:15px;
font-size:22px;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🐉 RADAR DEL DRAGÓN EN LA VIDA REAL POR FERNANDO DAEBOT 🐉</h1>

<div id="contador">
🎪 Portales restantes: 7
</div>

<div id="map"></div>

<div class="panel">

<br>

<input
id="jugador"
type="text"
placeholder="Tu nombre">

<br><br>

<input
id="codigo"
type="text"
placeholder="Código encontrado">

<br><br>

<button onclick="validarCodigo()">
VALIDAR
</button>

<div id="resultado"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let portalesRestantes = 7;

var map = L.map('map').setView(
[-17.9833,-67.1500],
13
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);

let portal1 =
L.marker([-17.9833,-67.1500])
.addTo(map)
.bindPopup(`
<h3>🎪 Portal Misterioso</h3>
<p>Estado: Disponible</p>
<p>Premio: ???</p>
`);

let portal2 =
L.marker([-17.9780,-67.1450])
.addTo(map)
.bindPopup(`
<h3>🎪 Portal Misterioso</h3>
<p>Estado: Disponible</p>
<p>Premio: ???</p>
`);

let portal3 =
L.marker([-17.9750,-67.1550])
.addTo(map)
.bindPopup(`
<h3>🎪 Portal Misterioso</h3>
<p>Estado: Disponible</p>
<p>Premio: ???</p>
`);

let portal4 =
L.marker([-17.9700,-67.1600])
.addTo(map)
.bindPopup(`
<h3>🎪 Portal Misterioso</h3>
<p>Estado: Disponible</p>
<p>Premio: ???</p>
`);

let portal5 =
L.marker([-17.9900,-67.1400])
.addTo(map)
.bindPopup(`
<h3>🎪 Portal Misterioso</h3>
<p>Estado: Disponible</p>
<p>Premio: ???</p>
`);

let portal6 =
L.marker([-17.9950,-67.1550])
.addTo(map)
.bindPopup(`
<h3>🎪 Portal Misterioso</h3>
<p>Estado: Disponible</p>
<p>Premio: ???</p>
`);

let portal7 =
L.marker([-17.9850,-67.1650])
.addTo(map)
.bindPopup(`
<h3>🎪 Portal Misterioso</h3>
<p>Estado: Disponible</p>
<p>Premio: ???</p>
`);

function actualizarContador(){

document.getElementById("contador").innerHTML =
"🎪 Portales restantes: " +
portalesRestantes;

}

function validarCodigo(){

let codigo =
document.getElementById("codigo").value;

if(codigo === "DRAGON001"){

map.removeLayer(portal1);

portalesRestantes--;

actualizarContador();

document.getElementById("resultado").innerHTML =
"🎉 Portal encontrado";

}

else if(codigo === "DRAGON002"){

map.removeLayer(portal2);

portalesRestantes--;

actualizarContador();

document.getElementById("resultado").innerHTML =
"🎉 Portal encontrado";

}

else if(codigo === "DRAGON003"){

map.removeLayer(portal3);

portalesRestantes--;

actualizarContador();

document.getElementById("resultado").innerHTML =
"🎉 Portal encontrado";

}

else{

document.getElementById("resultado").innerHTML =
"❌ Código incorrecto";

}

}

</script>

</body>
</html>
