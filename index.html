<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<h1>🐉 RADAR DEL DRAGÓN EN LA VIDA REAL POR FERNANDO DAEBOT 🐉</h1>
</head>

<body>


<p>Versión de prueba</p>

<input id="jugador" type="text" placeholder="Tu nombre">

<br><br>

<input id="codigo" type="text" placeholder="Código encontrado">

<br><br>

<button onclick="validarCodigo()">VALIDAR</button>

<br><br>

<div id="resultado"></div>

<script>

function validarCodigo() {

    let codigo = document.getElementById("codigo").value;

    if (
        codigo === "DRAGON001" ||
        codigo === "DRAGON002" ||
        codigo === "DRAGON003"
    ) {

        document.getElementById("resultado").innerHTML =
            "🎉 Código válido";

    } else {

        document.getElementById("resultado").innerHTML =
            "❌ Código incorrecto";

    }

}

</script>

</body>
