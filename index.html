<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

.titulo {
  font-size: 42px;
  color: gold;
  text-shadow: 0 0 10px red;
  margin-top: 15px;
  margin-bottom: 25px;
}

#map {
  height: 600px;
  width: 95%;
  margin: auto;
  border: 4px solid red;
  border-radius: 10px;
}

input {
  width: 320px;
  padding: 15px;
  margin: 8px;
  font-size: 22px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 15px 30px;
  font-size: 22px;
  border-radius: 8px;
  border: none;
  background: red;
  color: white;
  cursor: pointer;
  margin: 8px;
}

button:hover {
  background: darkred;
}

.paneles {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 40px;
  margin-bottom: 20px;
}

.patrocinio,
.ranking-panel {
  width: 250px;
}

.ranking-panel {
  background: #222;
  border: 3px solid gold;
  border-radius: 15px;
  padding: 15px;
  min-height: 300px;
  box-shadow: 0 0 15px gold;
}

.ranking-panel h2 {
  color: gold;
}

.patrocinio img {
  width: 220px;
  border-radius: 15px;
  border: 3px solid gold;
  box-shadow: 0 0 15px red;
}

.ranking-panel p {
  margin: 8px 0;
  font-size: 18px;
}
  .panel-estrellas {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin: 25px;
}

.busquedas-panel {
  width: 850px;
  height: 320px;
  background: #222;
  border: 3px solid gold;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 0 15px gold;
  overflow-y: auto;
}

.reloj-panel {
  width: 250px;
  background: #222;
  border: 3px solid red;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 0 15px red;
}

#relojGlobal {
  font-size: 50px;
  color: gold;
  font-weight: bold;
}

.fila-estrella {
  margin: 8px;
  padding: 10px;
  border-bottom: 1px solid #555;
  font-size: 18px;
  text-align: left;
}

</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<h1 class="titulo">
🐉RADAR DEL DRAGÓN DE FERNANDO DAEBOT🐉
</h1>

<div class="paneles">

  <div class="patrocinio">

    <img src="https://wallpapers.com/images/featured/dragon-radar-1x8sy1stb5gow51j.jpg">

  </div>

  <div>

    <input
      id="jugador"
      placeholder="Tu nombre">

    <br>

    <input
      id="celular"
      placeholder="Celular">

    <br>

    <input
      id="codigoManual"
      placeholder="Código encontrado">

    <br>

    <button onclick="validarManual()">
      Validar Código
    </button>

  </div>

  <div class="ranking-panel">

    <h2>🏆 TOP JUGADORES</h2>

    <div id="ranking">
      Cargando...
    </div>

  </div>

</div>

<div class="panel-estrellas">

  <div class="busquedas-panel">

    <h2>⭐ BÚSQUEDAS ACTIVAS ⭐</h2>

    <div id="listaEstrellas">

      Cargando búsquedas...

    </div>

  </div>

  <div class="reloj-panel">

  <h2 id="tituloReloj">
    ⏰ PRÓXIMA ESTRELLA
  </h2>

  <div id="relojGlobal">

      15:00

    </div>

  </div>

</div>

<div id="map"></div>
<audio id="musicaFondo" loop>
 <source src="sonido.mp3" type="audio/mpeg">
</audio>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

window.onload = function() {

  const map = L.map('map').setView(
    [-17.9833, -67.1500],
    13
  );
document.addEventListener(
  "click",
  function() {

    const musica =
    document.getElementById("musicaFondo");

    musica.play()
    .catch(error => {
      console.log(error);
    });

  },
  { once: true }
);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19
    }
  ).addTo(map);

  const marcadores = {};
  const estrellasMapa = {};
let tiempoRestante = 0;
  function cargarEntradas() {

    fetch(
      "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=listar"
    )

    .then(res => res.json())

    .then(data => {

      data.forEach(ent => {

        const clownIcon = L.divIcon({
          html: "<div style='font-size:40px;'>🎪</div>",
          className: "emoji-marker",
          iconSize: [60,60]
        });

        const marker = L.marker(
          [
            parseFloat(ent.latitud),
            parseFloat(ent.longitud)
          ],
          {
            icon: clownIcon
          }
        ).addTo(map);

        marker.bindPopup(`
          <h3>🎪 ${ent.nombre}</h3>
          <p>Puntos: ${ent.puntos}</p>
          <p>Tipo: ${ent.tipo}</p>
        `);

        marcadores[ent.codigo] = marker;

      });

    })

    .catch(error => {

      console.error(
        "Error cargando entradas:",
        error
      );

    });

  }

function cargarEstrellas() {

  fetch(
    "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=estadoEstrellas"
  )

  .then(res => res.json())

  .then(data => {

    let html = "";

    data.forEach(estrella => {
     if (
  !estrellasMapa[estrella.codigo]
) {

      // temporalmente sin filtro de zoom
let tamano = 12;
let zoomMinimo = 18;

if (estrella.ciudadVisible) {
  tamano = 18;
  zoomMinimo = 17;
}

if (estrella.visible) {
  tamano = 32;
  zoomMinimo = 13;
}
const estrellaIcon = L.divIcon({
  html:
  "<div style='font-size:" +
  tamano +
  "px;'>⭐</div>",

  className: "emoji-marker",

  iconSize: [
    tamano,
    tamano
  ]
});

  const marker = L.marker(
  [
    parseFloat(estrella.latitud),
    parseFloat(estrella.longitud)
  ],
  {
    icon: estrellaIcon
  }
);

if (map.getZoom() >= zoomMinimo) {
  marker.addTo(map);
}
  marker.bindPopup(
  "<h3>⭐ ESTRELLA</h3>" +
  "<p><b>Código:</b> " +
  estrella.codigo +
  "</p>"
);

  estrellasMapa[
    estrella.codigo
  ] = marker;
      

  
}
      let icono = "🎪";

      if (estrella.tipo == "RARA")
        icono = "🎭";

      if (estrella.tipo == "LEGENDARIA")
        icono = "🦷";

      let ciudad = "???";

      if (estrella.ciudadVisible) {
        ciudad = estrella.ciudad;
      }

      let estadoVisual = "🔍 BUSCANDO";

      if (estrella.visible) {
        estadoVisual = "⭐ VISIBLE";
      }

      html +=
      "<div class='fila-estrella'>" +
      icono +
      " 🌎 " +
      estrella.pais +
      " | 🏙️ " +
      ciudad +
      " | " +
      estadoVisual +
      "</div>";

    });

    document
    .getElementById("listaEstrellas")
    .innerHTML = html;

  });

}
  function cargarRanking() {

    fetch(
      "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=ranking"
    )

    .then(res => res.json())

    .then(data => {

      let html = "";

      data
      .slice(0,10)
      .forEach((jugador,index) => {

        html +=
          "<p><b>" +
          (index + 1) +
          ".</b> " +
          jugador.nombre +
          " - " +
          jugador.puntos +
          " pts</p>";

      });

      document
      .getElementById("ranking")
      .innerHTML = html;

    })

    .catch(error => {

      console.error(
        "Error cargando ranking:",
        error
      );

    });

  }

  window.validarManual = function() {

    const nombre =
      document.getElementById("jugador").value;

    const codigo =
      document.getElementById("codigoManual").value;

    const celular =
      document.getElementById("celular").value;

    fetch(
      "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec",
      {
        method: "POST",

        body: JSON.stringify({

          accion: "validar",
          nombre: nombre,
          celular: celular,
          codigo: codigo

        })

      }
    )

    .then(res => res.json())

    .then(resp => {

      if (resp.estado === "ok") {

        if (marcadores[codigo]) {

          map.removeLayer(
            marcadores[codigo]
          );

        }

        cargarRanking();

        alert(
          "🎉 +" +
          resp.puntos +
          " puntos"
        );

      } else {

        alert(
          "❌ Código inválido o ya usado"
        );

      }

    })

    .catch(error => {

      alert(
        "ERROR: " + error
      );

    });

  };

cargarEntradas();
cargarRanking();
cargarEstrellas();

  setInterval(
    cargarRanking,
    15000
  );
  setInterval(function(){

  fetch(
    "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=proxima"
  )

  .then(res => res.json())

  .then(data => {

    let ahora = new Date();

    let siguiente =
    new Date();

    siguiente.setHours(
      data.siguienteGeneracion
    );

    siguiente.setMinutes(0);
    siguiente.setSeconds(0);

    if(
      data.siguienteGeneracion
      <=
      data.horaActual
    ){
      siguiente.setDate(
        siguiente.getDate() + 1
      );
    }

    let diferencia =
    Math.floor(
      (
        siguiente.getTime()
        -
        ahora.getTime()
      ) / 1000
    );

    let horas =
    Math.floor(
      diferencia / 3600
    );

    let minutos =
    Math.floor(
      (diferencia % 3600)
      / 60
    );

    let segundos =
    diferencia % 60;

    document
    .getElementById("tituloReloj")
    .innerHTML =
    "⏰ PRÓXIMA ESTRELLA";

    document
    .getElementById("relojGlobal")
    .innerHTML =
    String(horas)
    .padStart(2,"0")
    + ":" +
    String(minutos)
    .padStart(2,"0")
    + ":" +
    String(segundos)
    .padStart(2,"0");

  });

},1000);
  setInterval(
  cargarEstrellas,
  15000
);

};

</script>



</body>
</html>
