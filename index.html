<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([-17.9833, -67.1500], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let marcadores = {};

function cargarEntradas() {

  fetch("https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=listar")
    .then(res => res.json())
    .then(data => {

      data.forEach(ent => {

        let marker = L.marker([ent.latitud, ent.longitud]).addTo(map);

        marker.bindPopup(`
          <h3>🎪 ${ent.nombre}</h3>
          <p>Puntos: ${ent.puntos}</p>
          <p>Tipo: ${ent.tipo}</p>
          <button onclick="abrirValidacion('${ent.codigo}')">Usar entrada</button>
        `);

        marcadores[ent.codigo] = marker;

      });

    });

}

function abrirValidacion(codigo) {

  let nombre = document.getElementById("jugador").value;

  if (!nombre) {
    alert("Escribe tu nombre primero");
    return;
  }

  fetch("https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec", {
    method: "POST",
    body: JSON.stringify({
      accion: "validar",
      nombre: nombre,
      celular: "web",
      codigo: codigo
    })
  })
  .then(res => res.json())
  .then(resp => {

    if (resp.estado === "ok") {

      map.removeLayer(marcadores[codigo]);

      document.getElementById("resultado").innerHTML =
        "🎉 +" + resp.puntos + " puntos";

    } else if (resp.estado === "usada") {

      document.getElementById("resultado").innerHTML =
        "⚠️ Ya usada";

    } else {

      document.getElementById("resultado").innerHTML =
        "❌ Código inválido";

    }

  });

}

cargarEntradas();

</script>
