<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

.titulo {
  font-size: 42px;
  color: gold;
  text-shadow: 0 0 10px red;
  margin-top: 15px;
  margin-bottom: 25px;
}

input {
  width: 320px;
  padding: 15px;
  margin: 8px;
  font-size: 22px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 15px 30px;
  font-size: 22px;
  border-radius: 8px;
  border: none;
  background: red;
  color: white;
  cursor: pointer;
  margin: 8px;
}

button:hover {
  background: darkred;
}

.paneles {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 40px;
  margin-bottom: 20px;
}

.patrocinio,
.ranking-panel {
  width: 250px;
}

.ranking-panel {
  background: #222;
  border: 3px solid gold;
  border-radius: 15px;
  padding: 15px;
  height: 420px;
  box-shadow: 0 0 15px gold;

  overflow-y: auto;
  overflow-x: hidden;
}

.ranking-panel h2 {
  color: gold;
}

.patrocinio img {
  width: 220px;
  border-radius: 15px;
  border: 3px solid gold;
  box-shadow: 0 0 15px red;
}

.ranking-panel p {
  margin: 8px 0;
  font-size: 18px;
}
  .panel-estrellas {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin: 25px;
}

.busquedas-panel {
  width: 850px;
  height: 320px;
  background: #222;
  border: 3px solid gold;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 0 15px gold;
  overflow-y: auto;
}

.reloj-panel {
  width: 250px;
  background: #222;
  border: 3px solid red;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 0 15px red;
}

#relojGlobal {
  font-size: 50px;
  color: gold;
  font-weight: bold;
}

.fila-estrella {
  margin: 8px;
  padding: 10px;
  border-bottom: 1px solid #555;
  font-size: 18px;
  text-align: left;
}
/* ================= RADAR ================= */

#radarOverlay{

    position:absolute;

    inset:0;

    z-index:5000;

    pointer-events:none;

}
#map{
    width:95%;
    height:700px;
    margin:20px auto;
    border-radius:20px;
    overflow:hidden;
    border:4px solid gold;
}
 #radarFrame{

    width:100%;

    height:100%;

    display:block;

}
  .leaflet-pane{

    z-index:1 !important;

}

.leaflet-top,
.leaflet-bottom{

    z-index:2 !important;

}
  /* ===== Barra de desplazamiento del ranking ===== */

.ranking-panel::-webkit-scrollbar{
    width:10px;
}

.ranking-panel::-webkit-scrollbar-track{
    background:#111;
    border-radius:10px;
}

.ranking-panel::-webkit-scrollbar-thumb{
    background:gold;
    border-radius:10px;
    border:2px solid #222;
}

.ranking-panel::-webkit-scrollbar-thumb:hover{
    background:#FFD700;
}
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<h1 class="titulo" id="tituloPrincipal">

🐉RADAR HISTORICO DE BOLIVIA POR FERNANDO DAEBOT🐉

</h1>

<div class="paneles">

  <div class="patrocinio">

      <img
  src="https://raw.githubusercontent.com/fernandodaebot/radar-del-dragon/refs/heads/main/IMAGEN.png">

  </div>

  <div>

    <input
      id="jugador"
      placeholder="Tu Nombre">

    <br>

    <input
      id="celular"
      placeholder="Celular">

    <br>

    <input
      id="codigoManual"
      placeholder="Código encontrado">

    <br>

    <button onclick="validarManual()">
      Validar Código
    </button>

  </div>

  <div class="ranking-panel">

    <h2>🏆 TOP JUGADORES</h2>

    <div id="ranking">
        Cargando...
    </div>

</div>
</div>

<div class="panel-estrellas">

  <div class="busquedas-panel">

    <h2>⭐ AUN QUEDAN 185 BÚSQUEDAS ACTIVAS PODRIAN AÑADIRSE MAS BUSQUEDASHASTA QUE TERMINE EL EVENTO ⭐</h2>

    <div id="listaEstrellas">

      Cargando búsquedas...

    </div>

  </div>

  <div class="reloj-panel">

<h2 id="tituloReloj">
  🐉 RADAR DEL DRAGÓN
</h2>

<div style="
font-size:18px;
color:gold;
margin-bottom:10px;
">
Próxima aparición de esfera
</div>

<div id="relojGlobal">
  15:00
</div>

  </div>

</div>

<div id="radar-container">

    <div id="map"></div>

</div>
  
  <audio id="musicaFondo" loop>
 <source src="sonido.mp3" type="audio/mpeg">
</audio>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

window.onload = function() {

 const map = L.map('map');

const bolivia = [
    [-22.9, -69.7], // Suroeste
    [-9.6, -57.3]   // Noreste
];

map.fitBounds(bolivia);
document.addEventListener(
  "click",
  function() {

    const musica =
    document.getElementById("musicaFondo");

    musica.play()
    .catch(error => {
      console.log(error);
    });

  },
  { once: true }
);

 L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom: 19,
    updateWhenZooming: false,
    updateWhenIdle: true,
    keepBuffer: 8
}
).addTo(map);
const marcadores = {};
const estrellasMapa = {};
  function cargarEntradas() {

    fetch(
      "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=listar"
    )

    .then(res => res.json())

    .then(data => {

    console.log(data);

    data.forEach(ent => {

let tamano = 32;
let zoomMinimo = 14;

const clownIcon = L.divIcon({
    html: "<img src='bandera.png' width='40' height='40'>",
    className: "",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
});

        const marker = L.marker(
          [
            parseFloat(ent.latitud),
            parseFloat(ent.longitud)
          ],
          {
            icon: clownIcon
          }
        ).addTo(map);
marker.zoomMinimo = zoomMinimo;

if (map.getZoom() < marker.zoomMinimo) {
    map.removeLayer(marker);
}
       let estadoVisual =
(ent.estado === "DISPONIBLE")
? "🟢 DISPONIBLE"
: "🔴 RECLAMADA";

marker.bindPopup(`
<h3>🇧🇴 ${ent.nombre}</h3>

<p>${ent.descripcion || ""}</p>

<p><b>Estado:</b> ${estadoVisual}</p>

<p><b>Código:</b> ${ent.codigo}</p>
`);
        marcadores[ent.codigo] = marker;

      });

    })

    .catch(error => {

      console.error(
        "Error cargando entradas:",
        error
      );

    });

  }

function cargarEstrellas() {

  fetch(
    "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=estadoEstrellas"
  )

  .then(res => res.json())

  .then(data => {

    let html = "";
data.reverse();
    data.forEach(estrella => {
     if (
  !estrellasMapa[estrella.codigo]
) {

      // temporalmente sin filtro de zoom
let tamano = 25;
let zoomMinimo = 14;

if (estrella.ciudadVisible) {
  tamano = 25;
  zoomMinimo = 14;
}

if (estrella.visible) {
  tamano = 32;
  zoomMinimo = 13;
}
const estrellaIcon = L.divIcon({
html:
"<div style='font-size:" +
tamano +
"px;'>⭐</div>",

  className: "emoji-marker",

  iconSize: [
    tamano,
    tamano
  ]
});

const marker = L.marker(
[
  parseFloat(estrella.latitud),
  parseFloat(estrella.longitud)
],
{
  icon: estrellaIcon
}
);

marker.zoomMinimo = zoomMinimo;

if (
  map.getZoom()
  >=
  marker.zoomMinimo
) {
  marker.addTo(map);
}
  marker.bindPopup(
  "<h3>⭐ ESTRELLA</h3>" +
  "<p><b>Código:</b> " +
  estrella.codigo +
  "</p>"
);

  estrellasMapa[
    estrella.codigo
  ] = marker;
      

  
}
      let icono = "🎪";

      if (estrella.tipo == "RARA")
        icono = "🎭";

      if (estrella.tipo == "LEGENDARIA")
        icono = "🦷";

      let ciudad = "???";

      if (estrella.ciudadVisible) {
        ciudad = estrella.ciudad;
      }

      let estadoVisual = "🔍 BUSCANDO";

      if (estrella.visible) {
        estadoVisual = "⭐ VISIBLE";
      }

      html +=
      "<div class='fila-estrella'>" +
      icono +
      " 🌎 " +
      estrella.pais +
      " | 🏙️ " +
      ciudad +
      " | " +
      estadoVisual +
      "</div>";

    });
console.log("HTML:", html);
    document
    .getElementById("listaEstrellas")
    .innerHTML = html;

  });

}
  function cargarRanking() {

    fetch(
      "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=ranking"
    )

    .then(res => res.json())

    .then(data => {

      let html = "";

      data.forEach((jugador,index) => {

        html +=
          "<p><b>" +
          (index + 1) +
          ".</b> " +
          jugador.nombre +
          " - " +
          jugador.puntos +
          " pts</p>";

      });

      document
      .getElementById("ranking")
      .innerHTML = html;

    })

    .catch(error => {

      console.error(
        "Error cargando ranking:",
        error
      );

    });

  }

  window.validarManual = function() {

    const nombre =
      document.getElementById("jugador").value;

    const codigo =
      document.getElementById("codigoManual").value;

    const celular =
      document.getElementById("celular").value;

    fetch(
      "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec",
      {
        method: "POST",

        body: JSON.stringify({

          accion: "validar",
          nombre: nombre,
          celular: celular,
          codigo: codigo

        })

      }
    )

    .then(res => res.json())

    .then(resp => {

      if (resp.estado === "ok") {

        if (marcadores[codigo]) {

          map.removeLayer(
            marcadores[codigo]
          );

        }

        cargarRanking();

        alert(
          "🎉 +" +
          resp.puntos +
          " puntos"
        );

      } else {

        alert(
          "❌ Código inválido o ya usado"
        );

      }

    })

    .catch(error => {

      alert(
        "ERROR: " + error
      );

    });

  };

cargarEntradas();
cargarRanking();
cargarEstrellas();
map.on("zoomend", function() {

  // Control de las estrellas
  Object.values(estrellasMapa)
  .forEach(marker => {

    if (map.getZoom() >= marker.zoomMinimo) {

      if (!map.hasLayer(marker)) {
        marker.addTo(map);
      }

    } else {

      if (map.hasLayer(marker)) {
        map.removeLayer(marker);
      }

    }

  });

  // Control de las banderas
  Object.values(marcadores)
  .forEach(marker => {

    if (map.getZoom() >= marker.zoomMinimo) {

      if (!map.hasLayer(marker)) {
        marker.addTo(map);
      }

    } else {

      if (map.hasLayer(marker)) {
        map.removeLayer(marker);
      }

    }

  });

});  
  setInterval(
    cargarRanking,
    15000
  );
  setInterval(function(){

  fetch(
    "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=proxima"
  )

  .then(res => res.json())

  .then(data => {

    let ahora = new Date();

    let siguiente =
new Date(data.proxima);
    let diferencia =
Math.max(
  0,
  Math.floor(
    (
      siguiente.getTime()
      -
      ahora.getTime()
    ) / 1000
  )
);
if (diferencia <= 0) {

document
.getElementById("relojGlobal")
.innerHTML =
"<span style='font-size:24px'>✨ MATERIALIZANDO ESFERA...</span>";

  return;

}
    let horas =
    Math.floor(
      diferencia / 3600
    );

    let minutos =
    Math.floor(
      (diferencia % 3600)
      / 60
    );

    let segundos =
    diferencia % 60;

   document
.getElementById("tituloReloj")
.innerHTML =
"⏳TIEMPO RESTANTE⏳";

    document
    .getElementById("relojGlobal")
    .innerHTML =
    String(horas)
    .padStart(2,"0")
    + ":" +
    String(minutos)
    .padStart(2,"0")
    + ":" +
    String(segundos)
    .padStart(2,"0");

  });

},1000);
  setInterval(
  cargarEstrellas,
  15000
);

};

</script>



</body>
</html>
