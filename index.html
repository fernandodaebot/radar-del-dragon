<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

.titulo {
  font-size: 42px;
  color: gold;
  text-shadow: 0 0 10px red;
  margin-top: 15px;
  margin-bottom: 25px;
}

#map {
  height: 600px;
  width: 95%;
  margin: auto;
  border: 4px solid red;
  border-radius: 10px;
}

input {
  width: 320px;
  padding: 15px;
  margin: 8px;
  font-size: 22px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 15px 30px;
  font-size: 22px;
  border-radius: 8px;
  border: none;
  background: red;
  color: white;
  cursor: pointer;
  margin: 8px;
}

button:hover {
  background: darkred;
}

.paneles {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 40px;
  margin-bottom: 20px;
}

.patrocinio,
.ranking-panel {
  width: 250px;
}

.ranking-panel {
  background: #222;
  border: 3px solid gold;
  border-radius: 15px;
  padding: 15px;
  min-height: 300px;
  box-shadow: 0 0 15px gold;
}

.ranking-panel h2 {
  color: gold;
}

.patrocinio img {
  width: 220px;
  border-radius: 15px;
  border: 3px solid gold;
  box-shadow: 0 0 15px red;
}

</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<h1 class="titulo">
🐉 RADAR DEL DRAGÓN POR FERNANDO DAEBOT 🐉
</h1>

<div class="paneles">

  <div class="patrocinio">

    <img
    src="https://wallpapers.com/images/featured/dragon-radar-1x8sy1stb5gow51j.jpg">

  </div>

  <div>

    <input
    id="jugador"
    placeholder="Tu nombre">

    <br>

    <input
    id="celular"
    placeholder="Celular">

    <br>

    <input
    id="codigoManual"
    placeholder="Código encontrado">

    <br>

    <button onclick="validarManual()">
      Validar Código
    </button>

  </div>

  <div class="ranking-panel">

    <h2>🏆 TOP JUGADORES</h2>

    <div id="ranking">
      Próximamente...
    </div>

  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

window.onload = function() {

  let map = L.map('map').setView([-17.9833, -67.1500], 13);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19
    }
  ).addTo(map);

  let marcadores = {};

  function cargarEntradas() {

    fetch(
      "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=listar"
    )

    .then(res => res.json())

    .then(data => {

      data.forEach(ent => {

        let clownIcon = L.divIcon({
          html:
          "<div style='font-size:40px;'>🎪</div>",
          className: "emoji-marker",
          iconSize: [60,60]
        });

        let marker = L.marker(
          [
            parseFloat(ent.latitud),
            parseFloat(ent.longitud)
          ],
          {
            icon: clownIcon
          }
        ).addTo(map);

        marker.bindPopup(`
          <h3>🎪 ${ent.nombre}</h3>
          <p>Puntos: ${ent.puntos}</p>
          <p>Tipo: ${ent.tipo}</p>
        `);

        marcadores[ent.codigo] = marker;

      });

    });

  }

  window.validarManual = function() {

    let nombre =
    document.getElementById("jugador").value;

    let codigo =
    document.getElementById("codigoManual").value;

    let celular =
    document.getElementById("celular").value;

    fetch(
      "https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec",
      {
        method: "POST",

        body: JSON.stringify({

          accion: "validar",
          nombre: nombre,
          celular: celular,
          codigo: codigo

        })

      }
    )

    .then(res => res.json())

    .then(resp => {

      if (resp.estado === "ok") {

        if (marcadores[codigo]) {

          map.removeLayer(
            marcadores[codigo]
          );

        }

        alert(
          "🎉 +" +
          resp.puntos +
          " puntos"
        );

      } else {

        alert(
          "❌ Código inválido o ya usado"
        );

      }

    })

    .catch(error => {

      alert(
        "ERROR: " + error
      );

    });

  }

  cargarEntradas();

};

</script>

</body>
</html>
