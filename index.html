<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Radar del Dragón</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
font-family:Arial;
text-align:center;
background:#111;
color:white;
}

#map{
height:600px;
width:100%;
border:3px solid #ff4444;
border-radius:10px;
}

input{
padding:10px;
margin:5px;
}

button{
padding:10px 20px;
font-size:16px;
cursor:pointer;
}

<body>

<h1>🐉 RADAR DEL DRAGÓN EN LA VIDA REAL POR FERNANDO DAEBOT 🐉</h1>

<p>🎪 Encuentra los portales misteriosos ocultos por la ciudad.</p>

<div id="map"></div>

<br>

<input id="jugador" type="text" placeholder="Tu nombre">

<br><br>

<input id="codigo" type="text" placeholder="Código encontrado">

<br><br>

<button onclick="validarCodigo()">VALIDAR</button>

<br><br>

<div id="resultado"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

function validarCodigo() {

let codigo =
document.getElementById("codigo").value;

if(
codigo === "DRAGON001" ||
codigo === "DRAGON002" ||
codigo === "DRAGON003"
){

document.getElementById("resultado").innerHTML =
"🎉 Código válido";

document.getElementById("resultado").innerHTML =
"❌ Código incorrecto";

}

var map = L.map('map').setView(

13

{

}
