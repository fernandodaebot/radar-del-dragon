<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

#map {
  height: 600px;
  width: 95%;
  margin: auto;
  border: 4px solid red;
  border-radius: 10px;
}

</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<h2>RADAR DEL DRAGÓN DE FERNANDO DAEBOT</h2>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

window.onload = function() {

let map = L.map('map').setView([-17.9833, -67.1500], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let marcadores = {};

function cargarEntradas() {

  fetch("https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec?accion=listar")
    .then(res => res.json())
    .then(data => {

      data.forEach(ent => {

        let carpaIcon = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/619/619034.png",
  iconSize: [40, 40],
  iconAnchor: [25, 50]
});

let clownIcon = L.divIcon({
  html: "<div style='font-size:40px;'>🎪</div>",
  className: "emoji-marker",
  iconSize: [60, 60]
});

let marker = L.marker(
  [parseFloat(ent.latitud), parseFloat(ent.longitud)],
  { icon: clownIcon }
).addTo(map);

        marker.bindPopup(`
          <h3>🎪 ${ent.nombre}</h3>
          <p>Puntos: ${ent.puntos}</p>
          <p>Tipo: ${ent.tipo}</p>
          <button onclick="abrirValidacion('${ent.codigo}')">Usar entrada</button>
        `);

        marcadores[ent.codigo] = marker;

      });

    });

}

window.abrirValidacion = function(codigo) {

  let nombre = document.getElementById("jugador")?.value || "web";

  fetch("https://script.google.com/macros/s/AKfycbyDpDviz_a9DOrTrpzOvgY5panW1bZ-g_5o59lsgd4D0TFB60TEm1_w5ZCgLQJUxLAG0w/exec", {
    method: "POST",
    body: JSON.stringify({
      accion: "validar",
      nombre: nombre,
      celular: "web",
      codigo: codigo
    })
  })
  .then(res => res.json())
  .then(resp => {

    if (resp.estado === "ok") {
      map.removeLayer(marcadores[codigo]);
      alert("🎉 +" + resp.puntos + " puntos");
    } else {
      alert("❌ Error o ya usada");
    }

  });

};

cargarEntradas();

};

</script>

</body>
</html>
