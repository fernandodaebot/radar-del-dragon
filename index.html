<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Radar del Dragón</title>
</head>

<body>

<h1>🐉 RADAR DEL DRAGÓN</h1>

<p>Versión de prueba</p>

<input id="jugador" placeholder="Tu nombre">

<br><br>

<input id="codigo" placeholder="Código encontrado">

<br><br>

<button onclick="validarCodigo()">
VALIDAR
</button>

<p id="resultado"></p>

<script>

function validarCodigo(){

let codigo =
document.getElementById("codigo").value;

if(
codigo === "DRAGON001" ||
codigo === "DRAGON002" ||
codigo === "DRAGON003"
){

document.getElementById("resultado").innerHTML =
"🎉 Código válido";

}else{

document.getElementById("resultado").innerHTML =
"❌ Código incorrecto";

}

}

</script>

</body>
</html>
